<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb" />
      <stop offset="50%" stop-color="#4f46e5" />
      <stop offset="100%" stop-color="#7c3aed" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#34d399" />
    </linearGradient>
  </defs>
  <!-- Rounded background -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" />
  <!-- Inner subtle outline -->
  <rect x="24" y="24" width="464" height="464" rx="104" fill="none" stroke="#ffffff" stroke-width="8" stroke-opacity="0.15" />
  
  <!-- Stylized Educational/Testing graphics: Book & Checkmark & Letter P -->
  <!-- Checkmark at background -->
  <path d="M140 270 L210 340 L380 170" fill="none" stroke="url(#accentGrad)" stroke-width="32" stroke-linecap="round" stroke-linejoin="round" opacity="0.9" />
  
  <!-- Letter P + Graduation Cap -->
  <g transform="translate(100, 90)">
    <!-- Graduation Cap on top of P -->
    <path d="M156 16 L276 66 L156 116 L36 66 Z" fill="#ffffff" />
    <path d="M80 86 v40 c0 20, 152 20, 152 0 v-40" fill="none" stroke="#ffffff" stroke-width="10" stroke-linecap="round" />
    <path d="M276 66 v50 c0 10-15 15-15 5" fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round" />
    
    <!-- Bold 'P' vertical stem and loop -->
    <path d="M110 130 V290" fill="none" stroke="#ffffff" stroke-width="36" stroke-linecap="round" />
    <path d="M110 130 H180 C220 130, 220 210, 180 210 H110" fill="none" stroke="#ffffff" stroke-width="36" stroke-linecap="round" stroke-linejoin="round" />
    <!-- Accent inside -->
    <path d="M176 170 v50" fill="none" stroke="url(#accentGrad)" stroke-width="16" stroke-linecap="round" />
  </g>
</svg>
