<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Taiyariya Portal</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <style>
        body {
            margin: 0;
            padding: 0;
            background: #0b0f19;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            width: 100vw;
            overflow: hidden;
        }
        @keyframes taiyariyaSpin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
    <script type="text/javascript">
        // Single Page Apps for GitHub Pages & Hostinger .htaccess redirects
        var pathSegmentsToKeep = 0;
        var l = window.location;
        l.replace(
            l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
            l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') +
            '/?/' +
            l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
            (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
            l.hash
        );
    </script>
</head>
<body>
    <div style="
        width: 48px;
        height: 48px;
        border: 3.5px solid rgba(0, 156, 252, 0.18);
        border-top-color: #009CFC;
        border-right-color: #0077C8;
        border-radius: 50%;
        animation: taiyariyaSpin 0.85s linear infinite;
        box-shadow: 0 0 20px rgba(0, 156, 252, 0.2);
    "></div>
</body>
</html>
