<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Taiyariya - Elite MCQ Practice & Mock Test Portal</title>
    <meta name="description" content="Taiyariya is India's premium educational testing portal. Access curated bilingual mock exams, comprehensive Blackbook reference keybooks, test series, interactive PDF course worksheets, and personalized scoring analytics." />
    <meta name="keywords" content="Taiyariya, taiyariya, taiyariya.in, Blackbook, MCQ tests, free mock test, exam preparation, ssc cgl, study materials, Taiyariya student app" />
    <meta name="author" content="Taiyariya" />
    <meta name="robots" content="index, follow" />
    <meta name="google-site-verification" content="k7WEweulUiwAmqV3D5oVNzLu528Ib-B5VT4s4F2f4" />
    <link rel="canonical" href="https://taiyariya.in/" />

    <!-- Google Fonts: Outfit (English) & Anek Devanagari (Hindi) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Anek+Devanagari:wght@400;500;600;700&family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <!-- MathJax Configuration & Script for beautiful math typesetting in Admin and Live Previews -->
    <script>
      window.MathJax = {
        tex: {
          inlineMath: [['\\(', '\\)'], ['$', '$']],
          displayMath: [['\\[', '\\]'], ['$$', '$$']],
          processEscapes: true,
          processEnvironments: true
        },
        options: {
          skipHtmlTags: ['script', 'noscript', 'style', 'textarea', 'pre', 'code']
        }
      };
    </script>
    <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>

    <!-- Google AdSense Site Verification -->
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-4084240304484658" crossorigin="anonymous"></script>

    <!-- Favicon and App Logo Metadata for Search Engines & Browsers -->
    <link rel="icon" type="image/png" href="https://i.ibb.co/GNHYwQv/file-00000000be548211a9ed25bf8420e390.png" />
    <link rel="shortcut icon" href="https://i.ibb.co/GNHYwQv/file-00000000be548211a9ed25bf8420e390.png" type="image/png" />
    <link rel="apple-touch-icon" href="https://i.ibb.co/GNHYwQv/file-00000000be548211a9ed25bf8420e390.png" />

    <!-- Google-friendly SiteNavigationElement Structured Data for Automatic Sitelinks -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "name": "Taiyariya",
      "alternateName": "Taiyariya",
      "url": "https://taiyariya.in/",
      "potentialAction": {
        "@type": "SearchAction",
        "target": "https://taiyariya.in/?search={search_term_string}",
        "query-input": "required name=search_term_string"
      }
    }
    </script>
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "ItemList",
      "name": "Primary Navigation Channels",
      "itemListElement": [
        {
          "@type": "SiteNavigationElement",
          "position": 1,
          "name": "Home",
          "description": "Access the main feed, notices, updates, saved bookmark questions, and daily practice guides.",
          "url": "https://taiyariya.in/home"
        },
        {
          "@type": "SiteNavigationElement",
          "position": 2,
          "name": "Tests",
          "description": "Unlock bilingual online CBT mock tests, previous year papers, and performance card analytics.",
          "url": "https://taiyariya.in/tests"
        },
        {
          "@type": "SiteNavigationElement",
          "position": 3,
          "name": "PDFs",
          "description": "Read official course guides, study worksheets, reference books, and PDF blackbooks offline.",
          "url": "https://taiyariya.in/pdfs"
        },
        {
          "@type": "SiteNavigationElement",
          "position": 4,
          "name": "Account",
          "description": "Manage your student license key profile status, active subscriptions, and view past solutions history.",
          "url": "https://taiyariya.in/account"
        }
      ]
    }
    </script>
  </head>
  <body>
    <!-- Semantic Navigation Elements for Search Engine Sitelinks & Crawlers -->
    <nav aria-label="Site Navigation" style="position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; border-width: 0;">
      <a href="https://taiyariya.in/home">Home</a>
      <a href="https://taiyariya.in/tests">Tests</a>
      <a href="https://taiyariya.in/pdfs">PDFs</a>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
