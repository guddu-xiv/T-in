name: Deploy Taiyariya to GitHub Pages

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci || npm install

      - name: Build Application
        run: npm run build

      - name: Setup GitHub Pages Artifacts & SPA Fallback
        run: |
          touch dist/.nojekyll
          if [ -f "public/404.html" ]; then
            cp public/404.html dist/404.html
          elif [ -f "dist/index.html" ]; then
            cp dist/index.html dist/404.html
          fi
          if [ -f "public/ads.txt" ] && [ ! -f "dist/ads.txt" ]; then
            cp public/ads.txt dist/ads.txt
          fi
          if [ -f "public/robots.txt" ] && [ ! -f "dist/robots.txt" ]; then
            cp public/robots.txt dist/robots.txt
          fi
          if [ -f "public/sitemap.xml" ] && [ ! -f "dist/sitemap.xml" ]; then
            cp public/sitemap.xml dist/sitemap.xml
          fi

      - name: Upload Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'dist'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
